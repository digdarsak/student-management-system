# Online: the host sets DB_URL, DB_USER, DB_PASSWORD and PORT. On your own computer these defaults are used.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sms-v2}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# Creates/updates tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
